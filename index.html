<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Consulta Comercial | USAM Costa Rica</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="book-open-check" class="w-8 h-8 text-indigo-300"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Manual de Consulta Comercial</h1>
                    <p class="text-xs text-indigo-200">Guía rápida de gestión por canal (WhatsApp & Llamada) • Adaptado a Costa Rica 🇨🇷</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-indigo-800 px-3 py-1.5 rounded-lg text-xs font-medium border border-indigo-700">
                <i data-lucide="target" class="w-4 h-4 text-emerald-400"></i>
                <span>18 Momentos Clave de la Ruta Comercial</span>
            </div>
        </div>
    </header>

    <!-- Barra de Filtros y Búsqueda -->
    <section class="bg-white border-b border-slate-200 shadow-sm sticky top-[72px] z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Buscador -->
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="search-input" onkeyup="filterCards()" placeholder="Buscar por palabra clave, objeción o momento..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Filtros Rápidos -->
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto text-xs">
                <button onclick="filterCategory('all')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-200 text-slate-700 font-medium hover:bg-slate-300">Todos (18)</button>
                <button onclick="filterCategory('contacto')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200">Contacto Inicial</button>
                <button onclick="filterCategory('perfilamiento')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200">Perfilamiento</button>
                <button onclick="filterCategory('propuesta')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200">Propuesta & Cotización</button>
                <button onclick="filterCategory('objeciones')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200">Manejo de Objeciones</button>
                <button onclick="filterCategory('cierre')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200">Seguimiento & Cierre</button>
            </div>
        </div>
    </section>

    <!-- Contenido Principal: Tarjetas de Consulta -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Renderizado dinámico vía JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
        <p>Manual de Consulta Comercial • USAM Costa Rica • Herramienta de Soporte y Productividad Comercial</p>
    </footer>

    <!-- Scripts y Datos con Voceo de Costa Rica -->
    <script>
        const data = [
            { id: 1, cat: 'contacto', momento: "1. Saludo inicial", objetivo: "Generar cercanía y abrir conversación", wa: "¡Hola, [Nombre]! 👋 Soy [Experto] de USAM. Es un gusto acompañarte en tu proceso de admisión. Contame, ¿qué programa estás buscando y qué te motivó a iniciar este proceso?", ll: "Hola, [Nombre], te saluda [Experto] de USAM. Te contacto porque recibimos tu solicitud sobre [programa]. Quiero conocer qué estás buscando para orientarte de manera precisa. Contame, ¿qué te motivó a consultar por este programa?" },
            { id: 2, cat: 'contacto', momento: "2. Cuando pide “información”", objetivo: "Evitar enviar información genérica", wa: "¡Claro, [Nombre]! Con gusto te ayudo. Para brindarte información realmente útil, contame: ¿qué aspecto querés conocer primero sobre el programa?", ll: "Claro, [Nombre]. Antes de contarte todos los detalles, quiero conocer qué estás buscando para enfocarme en la información que realmente necesitás. ¿Qué te motivó a consultar por el programa?" },
            { id: 3, cat: 'perfilamiento', momento: "3. Perfilamiento – motivación", objetivo: "Identificar el motivo de compra", wa: "¿Qué te motivó a buscar este programa en este momento?", ll: "Contame, ¿qué te llevó a buscar una formación en esta área justamente ahora?" },
            { id: 4, cat: 'perfilamiento', momento: "4. Perfilamiento – objetivo", objetivo: "Identificar el resultado esperado", wa: "¿Qué querés lograr profesionalmente al finalizar tus estudios?", ll: "Pensando en tu desarrollo profesional, ¿qué te gustaría conseguir al finalizar esta formación?" },
            { id: 5, cat: 'perfilamiento', momento: "5. Perfilamiento – necesidad", objetivo: "Detectar necesidad concreta", wa: "¿Qué aspecto de tu perfil profesional buscás fortalecer actualmente?", ll: "¿Qué competencia, conocimiento o aspecto de tu perfil sentís que necesitás fortalecer en este momento?" },
            { id: 6, cat: 'perfilamiento', momento: "6. Perfilamiento – decisión", objetivo: "Conocer criterio de compra", wa: "¿Qué es lo más importante para vos al momento de elegir una universidad?", ll: "Cuando comparás opciones de formación, ¿qué factores tienen mayor peso para tomar tu decisión?" },
            { id: 7, cat: 'propuesta', momento: "7. Conectar necesidad + programa", objetivo: "Personalizar el argumento", wa: "Por lo que me comentás sobre [necesidad], quiero destacar especialmente [atributo/diferencial], porque se relaciona directamente con lo que estás buscando.", ll: "Teniendo en cuenta que tu objetivo es [objetivo], quiero mostrarte cómo [atributo del programa] puede responder específicamente a esa necesidad." },
            { id: 8, cat: 'propuesta', momento: "8. Presentar el programa", objetivo: "Comunicar valor, no solo características", wa: "Además de [característica], uno de los aspectos que quiero destacar es [beneficio], ya que puede aportarte directamente en [necesidad detectada].", ll: "Más allá de las características del programa, quiero destacar [beneficio], porque está directamente relacionado con el objetivo que me comentaste." },
            { id: 9, cat: 'propuesta', momento: "9. Presentar inversión", objetivo: "Comunicar precio con seguridad", wa: "La inversión regular es de [valor]. Actualmente contás con [beneficio], por lo que tu inversión queda en [valor final]. Te compartiré la cotización con el detalle completo.", ll: "La inversión regular del programa es de [valor]. Actualmente tenés disponible [beneficio], por lo que el valor aplicable a tu proceso sería de [valor final]." },
            { id: 10, cat: 'propuesta', momento: "10. Enviar cotización", objetivo: "Dar contexto al documento", wa: "Te comparto tu cotización 📄 con el detalle de la inversión y los beneficios disponibles. Revisala y avanzamos con el siguiente paso de tu proceso.", ll: "Voy a compartirte la cotización para que tengás el detalle de la inversión y las condiciones aplicables. Una vez la revisés, avanzamos con el siguiente paso." },
            { id: 11, cat: 'objeciones', momento: "11. “Está muy caro”", objetivo: "Identificar la verdadera barrera", wa: "Entiendo, [Nombre]. Para orientarte correctamente, ¿la inversión es el principal aspecto que estás evaluando frente a otras opciones o hay algún otro factor que también estás considerando?", ll: "Entiendo. Para poder orientarte mejor, quiero identificar si la inversión es la principal barrera o si también estás evaluando algún otro aspecto del programa." },
            { id: 12, cat: 'objeciones', momento: "12. “Lo voy a pensar”", objetivo: "Profundizar antes de cerrar", wa: "Claro. Antes de dejarlo para después, quiero asegurarme de que tengás toda la información necesaria. ¿Qué aspecto necesitás revisar con mayor detalle para tomar la decisión?", ll: "Claro, es importante que tomés una decisión con toda la información. Antes de finalizar, ¿qué aspecto necesitás tener más claro para avanzar?" },
            { id: 13, cat: 'objeciones', momento: "13. “Voy a comparar”", objetivo: "Mantener la conversación comercial", wa: "Perfecto. Para que podás comparar de manera objetiva, revisá plan de estudios, modalidad, duración, inversión y diferenciales. Yo te compartiré la información completa de USAM.", ll: "Es totalmente válido comparar alternativas. Te recomiendo revisar plan de estudios, modalidad, duración, inversión y diferenciales. Quiero asegurarme de que tengás toda la información de USAM para hacerlo." },
            { id: 14, cat: 'objeciones', momento: "14. “Tengo que consultarlo”", objetivo: "Mantener avance", wa: "Perfecto. Te compartiré la cotización y la información principal para que podás revisarla. Después retomamos el proceso y resolvemos cualquier inquietud.", ll: "Perfecto. Te compartiré la información para que podás revisarla con ellos. Antes de finalizar, quiero asegurarme de que tengás claro el siguiente paso del proceso." },
            { id: 15, cat: 'cierre', momento: "15. Seguimiento", objetivo: "Retomar sin sonar insistente", wa: "Hola, [Nombre] 👋 Retomo nuestra conversación sobre [programa]. Quiero ayudarte a avanzar con la información que necesitás. Contame, ¿qué inquietud te surgió después de revisar la información?", ll: "Hola, [Nombre]. Retomo nuestro proceso sobre [programa]. Quiero conocer cómo avanzaste después de revisar la información y qué necesitás resolver para continuar." },
            { id: 16, cat: 'cierre', momento: "16. Documentación pendiente", objetivo: "Llevar a acción", wa: "Para continuar con tu proceso, enviame los documentos pendientes y dejamos lista esta etapa de admisión.", ll: "Para avanzar con tu proceso, el siguiente paso es completar la documentación pendiente. Una vez la tengamos, podemos continuar con tu matrícula." },
            { id: 17, cat: 'cierre', momento: "17. Cierre de matrícula", objetivo: "Generar acción concreta", wa: "Con la información que revisamos, avancemos hoy con tu matrícula para dejar listo tu ingreso a la próxima cohorte.", ll: "Ya revisamos el programa, resolvimos tus inquietudes y tenés claridad sobre la inversión. Avancemos entonces con tu matrícula." },
            { id: 18, cat: 'cierre', momento: "18. Aspirante no responde", objetivo: "Reactivar conversación", wa: "Hola, [Nombre] 👋 Retomo nuestra conversación sobre [programa]. Quiero ayudarte a avanzar con tu proceso. ¿Continuamos con la revisión de la información?", ll: "Hola, [Nombre]. Te contacto nuevamente para dar continuidad al proceso que iniciamos. Quiero conocer si ya pudiste revisar la información y qué necesitás para avanzar." }
        ];

        let currentCategory = 'all';

        function renderCards(items) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-500">No se encontraron momentos comerciales que coincidan con la búsqueda.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:border-indigo-300 transition-all";
                card.innerHTML = `
                    <div class="p-5 space-y-3">
                        <div class="flex justify-between items-start gap-2">
                            <span class="text-xs font-bold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md uppercase tracking-wider">${item.momento}</span>
                            <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded">Obj: ${item.objetivo}</span>
                        </div>

                        <!-- Sección WhatsApp -->
                        <div class="bg-emerald-50/60 border border-emerald-100 rounded-lg p-3 space-y-1">
                            <div class="flex justify-between items-center text-xs font-semibold text-emerald-800">
                                <span class="flex items-center gap-1"><i data-lucide="message-square" class="w-3.5 h-3.5"></i> WhatsApp 💬</span>
                                <button onclick="copyText('${escapeHtml(item.wa)}', this)" class="text-emerald-700 hover:text-emerald-900 font-bold text-[11px] flex items-center gap-0.5">
                                    <i data-lucide="copy" class="w-3 h-3"></i> Copiar
                                </button>
                            </div>
                            <p class="text-xs text-slate-700 italic">"${item.wa}"</p>
                        </div>

                        <!-- Sección Llamada -->
                        <div class="bg-blue-50/60 border border-blue-100 rounded-lg p-3 space-y-1">
                            <div class="flex justify-between items-center text-xs font-semibold text-blue-800">
                                <span class="flex items-center gap-1"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i> Llamada 📞</span>
                                <button onclick="copyText('${escapeHtml(item.ll)}', this)" class="text-blue-700 hover:text-blue-900 font-bold text-[11px] flex items-center gap-0.5">
                                    <i data-lucide="copy" class="w-3 h-3"></i> Copiar
                                </button>
                            </div>
                            <p class="text-xs text-slate-700 italic">"${item.ll}"</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text);
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="text-xs text-emerald-600 font-bold">¡Copiado!</span>`;
            setTimeout(() => { btn.innerHTML = originalText; lucide.createIcons(); }, 1500);
        }

        function filterCategory(cat) {
            currentCategory = cat;
            filterCards();
        }

        function filterCards() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = data.filter(item => {
                const matchesCat = currentCategory === 'all' || item.cat === currentCategory;
                const matchesQuery = item.momento.toLowerCase().includes(query) ||
                                     item.objetivo.toLowerCase().includes(query) ||
                                     item.wa.toLowerCase().includes(query) ||
                                     item.ll.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });
            renderCards(filtered);
        }

        // Inicializar
        renderCards(data);
    </script>
</body>
</html>
